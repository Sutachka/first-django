{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Space & Tech Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>


    <!-- Падающий снег на чистом CSS (не мешает кликам!) -->
    <div class="snowflakes" aria-hidden="true">
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
    </div>



    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <span class="santa-hat">🎅</span>
                <img src="{% static 'blog/images/logo.png' %}" alt="Логотип блога" class="logo-img">
                <span class="site-title">Space & Tech Blog 🎄</span>
            </div>
            <nav class="nav-links">
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'about' %}">О блоге</a>
                <a href="{% url 'feedback' %}">Отзывы 💬</a>
            </nav>
        </div>
    </header>

            <!-- Светящаяся гирлянда под шапкой -->
    <ul class="lightrope">
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <main class="content-container">
        {% block content %}
        {% endblock %}
    </main>




    <footer class="site-footer">
        <p>✨ С наступающим Новым годом! &copy; 2026 Практика Django. Сделано с любовью 🦁</p>
    </footer>
</body>
</html>
